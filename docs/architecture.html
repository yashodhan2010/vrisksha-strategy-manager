<div class="shell"><header class="topbar"><div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><div class="meta" id="meta"></div></div><button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark theme">Toggle theme</button></header><main class="content"><section class="diagram-wrap" aria-label="Interactive architecture diagram"><svg id="graph" role="img" aria-labelledby="title subtitle"></svg></section><aside class="side"><section class="panel"><h2>Flows</h2><div class="flow-list" id="flows"></div></section><section class="detail"><h2>Details</h2><div class="detail-body" id="detail">Click a flow to trace an end-to-end path, or click a node to inspect its role.</div></section><section class="legend"><h2>Legend</h2><div class="legend-grid" id="legend"></div></section></aside></main></div><div class="tooltip" id="tooltip"></div>
<script>
(()=>{'use strict';const model=JSON.parse(document.getElementById('model').textContent),svg=document.getElementById('graph'),flowsEl=document.getElementById('flows'),detailEl=document.getElementById('detail'),legendEl=document.getElementById('legend'),tooltip=document.getElementById('tooltip'),ns='http://www.w3.org/2000/svg',nodeW=160,nodeH=78,statusColors={built:'#22c55e',partial:'#f59e0b',planned:'#a855f7'},edgeMap=new Map,nodeMap=new Map;let activeFlowId=null,selectedNodeId=null;document.getElementById('title').textContent=model.meta.title;document.getElementById('subtitle').textContent=model.meta.subtitle;document.getElementById('meta').textContent=model.meta.repo+' | '+model.meta.generated_from;svg.setAttribute('viewBox','0 0 '+model.meta.canvas.width+' '+model.meta.canvas.height);initTheme();renderLegend();renderGraph();renderFlows();setDetailIntro();function initTheme(){const stored=localStorage.getItem('architecture-theme'),preferred=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=stored||preferred;document.getElementById('themeToggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('architecture-theme',next)})}function renderLegend(){const gt=document.createElement('div');gt.className='legend-row';gt.innerHTML='<strong>Groups</strong>';legendEl.appendChild(gt);Object.entries(model.meta.groups).forEach(([id,group])=>{const row=document.createElement('div');row.className='legend-row';row.innerHTML='<span class="swatch" style="--swatch:'+group.color+'"></span><span>'+escapeHtml(group.label)+'</span>';legendEl.appendChild(row)});const st=document.createElement('div');st.className='legend-row';st.style.marginTop='8px';st.innerHTML='<strong>Status</strong>';legendEl.appendChild(st);Object.entries(model.meta.status_legend).forEach(([id,label])=>{const row=document.createElement('div');row.className='legend-row';row.innerHTML='<span class="status-dot" style="background:'+(statusColors[id]||'#94a3b8')+'"></span><span><strong>'+id+'</strong>: '+escapeHtml(label)+'</span>';legendEl.appendChild(row)})}function renderGraph(){const defs=el('defs');defs.appendChild(marker('arrow','var(--line-strong)'));defs.appendChild(marker('arrowHighlight','var(--accent)'));svg.appendChild(defs);const edgeLayer=el('g',{id:'edgeLayer'}),nodeLayer=el('g',{id:'nodeLayer'});svg.append(edgeLayer,nodeLayer);model.edges.forEach(edge=>{const from=byId(edge.from),to=byId(edge.to),g=el('g',{class:'edge '+edge.kind,'data-edge':edgeKey(edge.from,edge.to)}),path=el('path',{d:edgePath(from,to),'marker-end':'url(#arrow)'});g.appendChild(path);edgeLayer.appendChild(g);edgeMap.set(edgeKey(edge.from,edge.to),g)});model.nodes.forEach(node=>{const color=(model.meta.groups[node.group]||{}).color||'#64748b',g=el('g',{class:'node',transform:'translate('+node.x+','+node.y+')','data-node':node.id,tabindex:'0',role:'button','aria-label':node.label,style:'--node-color:'+color});g.appendChild(el('rect',{class:'box',width:nodeW,height:nodeH,rx:8,ry:8}));g.appendChild(el('circle',{cx:14,cy:15,r:5.5,fill:statusColors[node.status]||'#94a3b8'}));wrapText(node.label,18,2).forEach((line,i)=>{const t=el('text',{class:'label',x:28,y:18+i*17});t.textContent=line;g.appendChild(t)});const tech=el('text',{class:'tech',x:14,y:55});tech.textContent=node.tech||'';g.appendChild(tech);const file=el('text',{class:'file',x:14,y:70});file.textContent=shorten(node.file||'');g.appendChild(file);g.addEventListener('mouseenter',event=>showTooltip(event,node));g.addEventListener('mousemove',moveTooltip);g.addEventListener('mouseleave',hideTooltip);g.addEventListener('click',()=>selectNode(node.id));g.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectNode(node.id)}});nodeLayer.appendChild(g);nodeMap.set(node.id,g)})}function renderFlows(){model.flows.forEach(flow=>{const button=document.createElement('button');button.type='button';button.className='flow-btn';button.dataset.flow=flow.id;button.innerHTML='<div class="flow-name"><span>'+escapeHtml(flow.name)+'</span><span class="badge">'+flow.status+'</span></div><div class="flow-summary">'+escapeHtml(flow.summary)+'</div>';button.addEventListener('click',()=>toggleFlow(flow.id));flowsEl.appendChild(button)})}function toggleFlow(flowId){activeFlowId=activeFlowId===flowId?null:flowId;selectedNodeId=null;applyHighlight();if(!activeFlowId){setDetailIntro();return}const flow=model.flows.find(item=>item.id===activeFlowId),nodeNames=flow.nodes.map(id=>byId(id).label).join(' -> ');detailEl.innerHTML='<strong>'+escapeHtml(flow.name)+'</strong><br>'+escapeHtml(flow.description)+'<br><br><strong>Path</strong><br>'+escapeHtml(nodeNames)}function selectNode(nodeId){selectedNodeId=nodeId;activeFlowId=null;applyHighlight();const node=byId(nodeId),flows=model.flows.filter(flow=>flow.nodes.includes(nodeId));detailEl.innerHTML='<strong>'+escapeHtml(node.label)+'</strong><br>'+escapeHtml(node.tooltip)+'<br><br><strong>Status</strong>: '+node.status+(node.noncanonical?' (noncanonical stand-in)':'')+'<br><strong>Group</strong>: '+escapeHtml((model.meta.groups[node.group]||{}).label||node.group)+'<br><strong>File</strong>: '+escapeHtml(node.file||'n/a')+'<br><strong>Tech</strong>: '+escapeHtml(node.tech||'n/a')+'<br><br><strong>Flows</strong><ul>'+(flows.map(flow=>'<li>'+escapeHtml(flow.name)+'</li>').join('')||'<li>None</li>')+'</ul>'}function applyHighlight(){document.querySelectorAll('.flow-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.flow===activeFlowId));nodeMap.forEach(el=>el.classList.remove('highlight','selected','dim'));edgeMap.forEach(el=>{el.classList.remove('highlight','dim');el.querySelector('path').setAttribute('marker-end','url(#arrow)')});if(activeFlowId){const flow=model.flows.find(item=>item.id===activeFlowId),nodes=new Set(flow.nodes),edges=new Set(flow.edges.map(pair=>edgeKey(pair[0],pair[1])));nodeMap.forEach((el,id)=>{el.classList.toggle('dim',!nodes.has(id));el.classList.toggle('highlight',nodes.has(id))});edgeMap.forEach((el,id)=>{const active=edges.has(id);el.classList.toggle('highlight',active);el.classList.toggle('dim',!active);if(active)el.querySelector('path').setAttribute('marker-end','url(#arrowHighlight)')})}else if(selectedNodeId){nodeMap.forEach((el,id)=>{el.classList.toggle('selected',id===selectedNodeId);el.classList.toggle('dim',id!==selectedNodeId)});edgeMap.forEach(el=>el.classList.add('dim'))}}function showTooltip(event,node){tooltip.innerHTML='<div class="tip-title">'+escapeHtml(node.label)+'</div><div>'+escapeHtml(node.tooltip)+'</div><div class="tip-meta">'+node.status+(node.noncanonical?' | noncanonical':'')+(node.file?' | '+escapeHtml(node.file):'')+'</div>';tooltip.classList.add('visible');moveTooltip(event)}function moveTooltip(event){const pad=18,rect=tooltip.getBoundingClientRect();let x=event.clientX+14,y=event.clientY+14;if(x+rect.width>window.innerWidth-pad)x=event.clientX-rect.width-14;if(y+rect.height>window.innerHeight-pad)y=event.clientY-rect.height-14;tooltip.style.left=Math.max(pad,x)+'px';tooltip.style.top=Math.max(pad,y)+'px'}function hideTooltip(){tooltip.classList.remove('visible')}function setDetailIntro(){detailEl.textContent='Click a flow to trace an end-to-end path, or click a node to inspect its role.'}function edgePath(from,to){const a=port(from,to),b=port(to,from),dx=Math.max(55,Math.abs(b.x-a.x)*.45),c1x=a.x+(b.x>=a.x?dx:-dx),c2x=b.x-(b.x>=a.x?dx:-dx);return'M '+a.x+' '+a.y+' C '+c1x+' '+a.y+', '+c2x+' '+b.y+', '+b.x+' '+b.y}function port(a,b){const ac={x:a.x+nodeW/2,y:a.y+nodeH/2},bc={x:b.x+nodeW/2,y:b.y+nodeH/2},dx=bc.x-ac.x,dy=bc.y-ac.y;if(Math.abs(dx)>Math.abs(dy))return{x:ac.x+(dx>0?nodeW/2:-nodeW/2),y:ac.y};return{x:ac.x,y:ac.y+(dy>0?nodeH/2:-nodeH/2)}}function marker(id,color){const m=el('marker',{id:id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});m.appendChild(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));return m}function byId(id){const item=model.nodes.find(node=>node.id===id);if(!item)throw new Error('Unknown node: '+id);return item}function edgeKey(from,to){return from+'->'+to}function el(name,attrs={}){const node=document.createElementNS(ns,name);Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,value));return node}function wrapText(text,maxChars,maxLines){const words=text.split(' '),lines=[''];words.forEach(word=>{const last=lines[lines.length-1];if((last+' '+word).trim().length<=maxChars||!last)lines[lines.length-1]=(last+' '+word).trim();else if(lines.length<maxLines)lines.push(word);else lines[lines.length-1]+=' '+word});return lines.slice(0,maxLines)}function shorten(path){return path.length>24?'...'+path.slice(-21):path}function escapeHtml(value){return String(value).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}})();
</script>
